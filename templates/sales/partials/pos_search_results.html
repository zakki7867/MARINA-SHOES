{% load i18n %}
{% for v in variants %}
<button
  type="button"
  data-variant-id="{{ v.pk }}"
  data-sku="{{ v.sku }}"
  data-barcode="{{ v.barcode|default:'' }}"
  onclick="posAddItem('{{ v.pk }}', '{{ v.sku|escapejs }}', '{{ v.product.name|escapejs }} ({{ v.color|escapejs }}/{{ v.size|escapejs }})', '{{ v.current_stock }}', '{{ v.wholesale_price }}', '{{ v.retail_price }}')"
  class="pos-result-item w-full text-left p-3 rounded-lg border border-slate-200 hover:border-sky-500 hover:bg-sky-50 transition flex items-center justify-between gap-2"
>
  <div>
    <div class="font-semibold text-sm text-slate-900">{{ v.product.brand.name }} {{ v.product.name }}</div>
    <div class="text-xs text-slate-500">
      {{ v.color }} &middot; {% trans "Size" %} {{ v.size }} &middot; <span class="font-mono">{{ v.sku }}</span>{% if v.product.style_code %} &middot; {{ v.product.style_code }}{% endif %}
    </div>
  </div>
  <div class="text-right shrink-0">
    <div class="text-xs font-bold text-slate-900">{% trans "R:" %} {{ store_settings.currency_symbol|default:"KD" }} {{ v.retail_price }} | {% trans "W:" %} {{ store_settings.currency_symbol|default:"KD" }} {{ v.wholesale_price }}</div>
    <div class="text-xs {% if v.is_low_stock %}text-amber-700{% else %}text-emerald-700{% endif %}">{% trans "Stock:" %} {{ v.current_stock }}</div>
  </div>
</button>
{% empty %}
<div class="text-sm text-slate-500 py-4 text-center">{% trans "No matching variants found." %}</div>
{% endfor %}
